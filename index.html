<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murder &amp; Motive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#0c0808;--card:#191111;--ink:#efe7da;--muted:#a8978b;--line:#4a2d2b;
  --tape:#8f0d17;--tape-ink:#f5eee2;--blood:#ff4040;--ok:#86cda1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0808;--card:#191111;--ink:#efe7da;--muted:#a8978b;--line:#4a2d2b;
  --tape:#8f0d17;--tape-ink:#f5eee2;--blood:#ff4040;--ok:#86cda1;}}
:root[data-theme="dark"]{
  --bg:#0c0808;--card:#191111;--ink:#efe7da;--muted:#a8978b;--line:#4a2d2b;
  --tape:#8f0d17;--tape-ink:#f5eee2;--blood:#ff4040;--ok:#86cda1;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Courier Prime","Courier New",Courier,monospace}
h1,h2,h3,.disp{font-family:"Special Elite","Courier New",monospace;font-weight:400;line-height:1;margin:0;letter-spacing:.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{background:var(--tape);color:var(--tape-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--tape-ink)}
.hd{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.hd h1{font-size:1.9rem;text-transform:uppercase}
.hd .case{font-size:.85rem;line-height:1.2}
.meter{display:flex;gap:6px 16px;align-items:center;margin-left:auto;flex-wrap:wrap}
.meter b{font-family:"Special Elite","Courier New",monospace;font-size:1.45rem;font-weight:400}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:18px;background:var(--tape-ink);display:block}
.pips i.off{background:transparent;border:2px solid var(--tape-ink)}
.btn{background:var(--card);border:2px solid var(--ink);padding:8px 12px;min-height:42px;font-weight:700;font-size:.9rem}
.btn:hover:not(:disabled){background:var(--ink);color:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.dark{background:var(--tape-ink);color:var(--tape);border-color:var(--tape-ink)}
.btn.red{border-color:var(--blood);color:var(--blood)}
.btn.red:hover:not(:disabled){background:var(--blood);color:var(--card)}
.btn.on{background:var(--ink);color:var(--card)}
.btn small{font-weight:400;opacity:.75}
.notice{margin:16px 0 0;padding:12px 14px;border-left:8px solid var(--blood);background:var(--card);font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;margin-top:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;border-bottom:3px solid var(--ink);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-family:"Special Elite","Courier New",monospace;font-weight:400;font-size:1.2rem;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.brief{margin:0 0 18px;max-width:68ch}
.brief h2{font-size:2.6rem;text-transform:uppercase;margin-bottom:8px}
details.how{margin:0 0 18px;border:2px dashed var(--line);padding:8px 12px;max-width:68ch}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 4px;padding-left:20px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:2px solid var(--ink);padding:14px;position:relative}
.card h3{font-size:1.5rem;margin-bottom:2px}
.card .sub,.sub{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.card p{margin:6px 0}
.vnum{position:absolute;top:0;right:0;background:var(--ink);color:var(--card);padding:2px 9px;font-family:"Special Elite","Courier New",monospace;font-weight:400;font-size:1.1rem}
.vnum.live{background:var(--ok)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0}
.blk{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;font-size:.92rem}
.card.sus{border-color:var(--blood);box-shadow:inset 6px 0 0 var(--blood)}
.card.clr{opacity:.55}
.card.clr h3{text-decoration:line-through}
.good{color:var(--ok);font-weight:700}.bad{color:var(--blood);font-weight:700}
.side{display:grid;gap:16px}
.panel{background:var(--card);border:2px solid var(--ink);padding:14px}
.panel h2{font-size:1.5rem;margin-bottom:6px}
.panel h3{font-size:1.1rem;margin:14px 0 4px;color:var(--muted)}
.panel ul{margin:0;padding:0;list-style:none}
.panel li{padding:4px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.panel li b{display:block}
.bar{height:14px;border:2px solid var(--ink);margin:4px 0 8px}
.bar i{display:block;height:100%;background:var(--blood)}
.empty{color:var(--muted);font-style:italic}
.log{list-style:none;margin:0;padding:0;max-width:72ch}
.log li{background:var(--card);border-left:6px solid var(--ink);padding:10px 12px;margin-bottom:8px}
.log li.w{border-left-color:var(--tape)}
.letter{background:var(--card);border:2px solid var(--ink);padding:16px;margin-bottom:14px;max-width:64ch}
.letter blockquote{margin:8px 0;font-style:italic;font-size:1.05rem}
.field{border:2px solid var(--ink);background:var(--card);padding:8px 10px;min-height:42px;width:11em;text-transform:uppercase}
.code{font-family:"Special Elite","Courier New",monospace;font-weight:400;font-size:2rem;letter-spacing:.08em}
.end{max-width:70ch;margin:28px auto}
.end h2{font-size:clamp(2.6rem,9vw,5rem);text-transform:uppercase;margin-bottom:12px}
.end .card{margin:16px 0}
.stamp{display:inline-block;border:4px solid currentColor;padding:2px 12px;transform:rotate(-3deg);font-family:"Special Elite","Courier New",monospace;font-weight:400;font-size:1.6rem;margin-bottom:14px}
.stamp.win{color:var(--ok)}.stamp.lose{color:var(--blood)}
section.desk{max-width:72ch;margin-bottom:26px}
section.desk h2{font-size:1.7rem;margin-bottom:6px}

body{background:var(--bg) radial-gradient(ellipse at 50% 0,#2a0c0e 0,transparent 60%) no-repeat;min-height:100vh}
.hd h1,.brief h2,.end h2{font-family:"Permanent Marker","Special Elite",cursive;text-transform:uppercase;letter-spacing:.02em}
.brief h2,.end h2{color:var(--blood);text-shadow:2px 2px 0 #000}
.banner{display:block;width:100%;height:auto;margin:16px 0 20px;border:2px solid var(--line);box-shadow:0 8px 30px #000}
.card,.panel,.letter{border-color:var(--line);box-shadow:0 4px 14px rgba(0,0,0,.6)}
.card::before{content:"";position:absolute;top:-7px;left:14px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b6b,#b00d18 60%,#5a0509);box-shadow:0 2px 3px #000}
.tabs{border-bottom-color:var(--tape)}
.tabs button[aria-selected="true"]{background:var(--tape);color:var(--tape-ink)}
.btn{border-color:var(--muted)}
.btn.dark{background:#c1121f;color:#fff;border-color:#c1121f}
.btn.dark:hover:not(:disabled){background:#fff;color:#8f0d17}
header{border-bottom-color:#000;box-shadow:0 2px 12px #000}
.log li{border-left-color:var(--muted)}.log li.w{border-left-color:#c9a227}
.vnum{background:#000;color:var(--ink)}.vnum.live{background:var(--ok);color:#000}
.bar{border-color:var(--muted)}
.vnum{position:static;display:inline-block;font-size:.78rem;line-height:1.3;padding:2px 8px;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:400}
.field.wide{width:17em;max-width:100%;text-transform:none}
section.desk ul{padding-left:20px}
</style>
</head>

const VTYPES=[["night-shift workers",["night nurse","security guard","bakery worker","janitor","dispatcher"]],["people who lived alone",["retired teacher","bookkeeper","piano tuner","librarian","widowed pensioner"]],["hitchhikers and drifters",["seasonal picker","drifter","runaway","traveling salesman","busker"]],["late-night bar regulars",["bartender","dockworker","cab driver","musician","short-order cook"]],["joggers and dog walkers",["dental hygienist","law clerk","postal carrier","schoolteacher","florist"]],["people who had recently been in the newspaper",["lottery winner","local councilman","prize-winning gardener","acquitted defendant","spelling bee judge"]],["commuters on the last train",["typist","insurance adjuster","student","waitress","usher"]],["door-to-door callers",["census taker","meter reader","missionary","encyclopedia salesman","charity collector"]]];
const LOCS=["under a railway arch","in a drained canal lock","behind a shuttered cinema","in a church vestibule","on an allotment garden path","in a parking structure stairwell","beside a storm drain outfall","in an abandoned greenhouse","at a bus shelter","in a laundromat after closing","on a footbridge","in a freight yard"];
const MOTIVES=["believed each victim had been 'chosen' by a pattern only they could see in the classified ads","was re-enacting, over and over, the night a parent walked out","kept a ledger of people who had slighted strangers in public and worked through it","was convinced the city was 'overdue' and that each death postponed a flood","wanted a detective, any detective, to finally notice their work","had been rehearsing since childhood on animals and simply ran out of patience","believed the signature was a gift, and could not understand why no one thanked them","killed whenever a letter to an estranged sibling came back unopened","was collecting what they called 'quiet faces'","had convinced themselves the victims asked for it in dreams"];
const MON_B=["Lamplighter","Tailor","Collector","Shepherd","Choirmaster","Watchmaker","Ferryman","Gardener","Archivist","Sandman","Cartographer","Undertaker","Locksmith","Chaplain","Night Clerk","Beekeeper","Bellringer","Tallyman"];
const MON_A=["Quiet","Patient","Midnight","Sunday","Hollow","Gentle","Pale","Polite"];
const FLAGS=["Flagged by an anonymous tip line call.","Stopped by patrol two blocks from the first scene.","Prior complaint for following a stranger home.","Works within sight of one of the dump sites.","Named by a neighbor who 'never liked the look of them'.","Seen arguing with the first victim a week before.","Called in asking a few too many questions about the case.","Vehicle ticketed near a scene on the night in question."];
const TYPES={
 planner:{label:"Methodical planner",desc:"Kills on a fixed schedule and rotates through the same districts in order. Leaves very little at a scene and gives nothing away under questioning."},
 impulsive:{label:"Impulsive",desc:"No schedule at all. Usually follows a district rotation but breaks it on a whim. Sloppy, and likely to crack in an interview room."},
 showman:{label:"Attention seeker",desc:"Wants an audience. Writes to you the day before a strike and names the district. The hard part is telling the real letters from the cranks."},
 escalator:{label:"Escalating",desc:"The gap between murders gets shorter every time. The district rotation holds, but the clock is running down."}};
const TELL={planner:"No reaction at all. Not even curiosity.",impulsive:"Went rigid. A knee started bouncing under the table.",showman:"Smiled, then covered it with a cough.",escalator:"Asked, too quickly, how many that makes now."};
const NEUTRAL=["Looked confused, then a little sick.","Asked if that was really true.","Shook their head and said nothing.","Wanted to know why you were telling them this."];
const SLIP={planner:.1,impulsive:.55,showman:.5,escalator:.3};
const LETTERS=[
 s=>`Detective. Twelve names on your wall and you keep looking past mine. Here is what you kept from the papers: ${s} Now you know this is really me.`,
 s=>`I read about myself every morning and they get it wrong every time. They do not know this, but you do: ${s}`,
 s=>`You are tired. I can tell from the photographs. Check your own files if you doubt who is writing: ${s}`,
 s=>`People are locking their doors because of me. I want credit for the details. ${s} That part is mine.`];
const RANKS=[["Detective",0,"No perks yet."],["Detective Sergeant",150,"One extra hour each day."],["Lieutenant",400,"Background checks take 2 hours instead of 3."],["Captain",800,"Judges grant your warrants on less evidence."],["Chief Inspector",1400,"A second extra hour each day."]];

/* ---------- seeded generation ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FOR=["shoe","blood","hair","habit","hand"];
const decade=a=>Math.floor(a/10)*10+"s";
const cap=s=>s[0].toUpperCase()+s.slice(1);
function clueText(kind,trait,val){
  if(kind==="Forensics")return{shoe:`Partial shoe impression lifted near the body. Size ${val}.`,blood:`Foreign blood under the victim's fingernails. Type ${val}.`,hair:`A single ${val} hair on the victim's collar that isn't theirs.`,habit:(HABITS.find(h=>h[0]===val)||[])[1],hand:`The direction of the injuries points to a ${val}-handed attacker.`}[trait];
  if(kind==="Autopsy")return{field:FIELD_HINT[val],build:`Bruise spacing and the force involved point to an attacker of ${val} build.`,height:`Wound trajectory indicates an attacker of ${val} height.`}[trait];
  if(kind==="Letter")return{hand:`Lab note on a letter: ink drag shows the writer is ${val}-handed.`,field:`Lab note on a letter: the paper carries traces consistent with ${FIELD[val]}.`,habit:`Lab note on a letter: residue on the page shows the writer ${val}.`}[trait];
  if(kind==="Survivor")return{height:`The survivor is certain the attacker was of ${val} height.`,hair:`The survivor saw ${val} hair when the attacker's hood slipped.`,vehicle:`The attacker fled in a ${val}. A patrol officer saw it too.`}[trait];
  return{vehicle:`"There was a ${val} parked with its lights off. I remember thinking it was odd."`,age:`"Somebody in their ${val}, I'd say. Walked off fast."`,height:`"Whoever it was looked ${val==="average"?"about average height":val} to me."`,build:`"${cap(val)} build, I think. Had a hood up."`,hair:`"I caught a glimpse of ${val} hair under the cap."`}[trait];
}
function generate(seed){
  const r=rng(seed),pick=a=>a[Math.floor(r()*a.length)],int=(a,b)=>a+Math.floor(r()*(b-a+1));
  const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const city=pick(CITY_A)+pick(CITY_B),districts=shuf(DISTRICTS).slice(0,6),used=new Set();
  const name=()=>{let n;do{n=pick(FIRST)+" "+pick(LAST)}while(used.has(n));used.add(n);return n};
  const person=()=>{const o=pick(OCC);return{name:name(),age:int(24,63),occ:o[0],field:o[1],height:pick(HEIGHT),build:pick(BUILD),hair:pick(HAIR),district:pick(districts),shoe:int(7,13),blood:pick(BLOOD),hand:r()<.25?"left":"right",habit:pick(HABITS)[0],vehicle:pick(ALLVEH),flag:pick(FLAGS)}};
  const type=pick(Object.keys(TYPES));
  const killer=person();killer.killer=true;killer.alibi=[0,0,0,0,0,0,0,0,0];
  const others=[];
  while(others.length<11){const p=person();if(FOR.filter(t=>p[t]!==killer[t]).length>=2){p.alibi=killer.alibi.map(()=>r()<.3?1:0);others.push(p)}}
  const suspects=shuf([killer,...others]);
  suspects.forEach(s=>{const tr=pick(["shoe","habit","hand","vehicle"]);
    const pool={shoe:[7,8,9,10,11,12,13],habit:HABITS.map(h=>h[0]),hand:["left","right"],vehicle:ALLVEH}[tr].filter(v=>v!==s[tr]);
    const lie=s.killer?true:r()<.12,alt=pick(pool),nerv=r()<.2,tell=pick(Object.values(TELL)),neu=pick(NEUTRAL),sl=r();
    s.talk={trait:tr,claim:lie?alt:s[tr],react:s.killer?TELL[type]:nerv?tell:neu,slip:!!s.killer&&sl<SLIP[type]}});
  const vt=pick(VTYPES),sig=pick(SIGS);
  const mo={type,method:pick(METHODS),sig,vtype:vt[0],motive:pick(MOTIVES),moniker:"The "+(r()<.5?pick(districts):pick(MON_A))+" "+pick(MON_B)};
  const fo=shuf(FOR),ao=shuf(["field","build","height"]),wo=shuf(["vehicle","age","height","build","hair"]);
  const kv=t=>t==="age"?decade(killer.age):killer[t];
  const wrong=t=>pick({vehicle:ALLVEH,age:["20s","30s","40s","50s","60s"],height:HEIGHT,build:BUILD,hair:HAIR}[t].filter(v=>v!==kv(t)));
  const mk=(src,trait,val,sure)=>({src,trait,val,sure,text:clueText(src,trait,val)});
  const cyc=shuf(districts).slice(0,int(2,4)),victims=[];
  for(let i=0;i<9;i++){
    const wt=wo[i%5],ok=r()<.75,stray=r()<.3,rd=pick(districts);
    const scene=type==="planner"?[mk("Forensics",fo[i%5],killer[fo[i%5]],true)]:[mk("Forensics",fo[(2*i)%5],killer[fo[(2*i)%5]],true),mk("Forensics",fo[(2*i+1)%5],killer[fo[(2*i+1)%5]],true)];
    victims.push({name:name(),age:int(19,71),occ:pick(vt[1]),district:type==="impulsive"&&stray?rd:cyc[i%cyc.length],loc:pick(LOCS),scene,
      autopsy:mk("Autopsy",ao[i%3],killer[ao[i%3]],true),
      witness:Object.assign(mk("Witness",wt,ok?kv(wt):wrong(wt),false),{who:name()})});
  }
  const K=int(4,5),iv=[];
  for(let j=0;j<8;j++){const a=int(2,6),b=int(4,6),c=int(3,5);iv.push(type==="planner"?K:type==="escalator"?Math.max(2,6-j):type==="impulsive"?(j===1?b:a):c)}
  const strike=[0,-int(0,1)];strike[0]=strike[1]-iv[0];for(let j=1;j<8;j++)strike[j+1]=strike[j]+iv[j];
  const letters=[];
  const letter=(day,genuine,next)=>{const tr=pick(["hand","field","habit"]);
    const fake={hand:pick(["left","right"]),field:pick(Object.keys(FIELD)),habit:pick(HABITS)[0]}[tr],fsig=pick(SIGS.filter(x=>x!==sig)),fd=pick(districts),tpl=pick(LETTERS);
    letters.push({day,genuine,trait:tr,val:genuine?killer[tr]:fake,postmark:genuine?killer.district:fd,body:tpl(genuine?sig:fsig)+(next?` Tomorrow night, ${next}.`:"")})};
  if(type==="showman"){for(let k=2;k<9;k++)if(strike[k]-1>=2)letter(strike[k]-1,true,victims[k].district)}
  else for(let n=type==="planner"?1:2;n>0;n--)letter(int(2,12),true,"");
  for(let n=2;n>0;n--){const d=int(2,14),nx=r()<.5?pick(districts):"";letter(d,false,nx)}
  const decoy=pick(districts.filter(x=>x!==killer.district));
  return{seed,city,districts,suspects,mo,victims,strike,letters,geo:shuf([killer.district,decoy])};
}

/* ---------- storage, career ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let stats=Object.assign({solved:0,lost:0,seeds:[],xp:0,archive:[],done:[]},store.get("nta_stats",{}));
let C,P;
const rank=()=>{let n=0;RANKS.forEach((x,i)=>{if(stats.xp>=x[1])n=i});return n};
const code=s=>s.toString(36).toUpperCase();
const killer=()=>C.suspects.find(s=>s.killer);
const dead=()=>P.vs.length;
const maxHours=()=>8+(rank()>=1?1:0)+(rank()>=4?1:0)-(P.panic>=60?1:0)-(P.panic>=80?1:0);
function newSeed(){let s;const a=new Uint32Array(1);do{crypto.getRandomValues(a);s=a[0]}while(stats.seeds.includes(s));return s}
function startCase(seed){if(!stats.seeds.includes(seed)){stats.seeds.push(seed);if(stats.seeds.length>5000)stats.seeds.shift();store.set("nta_stats",stats)}
  C=generate(seed);P={day:1,hours:8,vs:[0,1],nxt:2,saved:[],panic:25,done:{},clues:[],letters:[],tags:{},dug:{},alibi:{},talked:{},sus:{},watched:{},searched:{},stake:null,patrol:null,press:0,profile:false,over:null,tab:"victims",confirm:null,notice:""};
  P.hours=maxHours();save();render();window.scrollTo(0,0)}
function save(){store.set("nta2_game",{seed:C.seed,P})}

/* ---------- actions ---------- */
const cost=k=>({scene:3,autopsy:2,witness:2,dig:rank()>=2?2:3,alibi:2,profile:3,talk:2,stake:4,patrol:3,press:2,warrant:4})[k];
function spend(h){if(P.hours<h)return false;P.hours-=h;P.notice="";return true}
function addClue(c,v){P.clues.unshift(Object.assign({day:P.day,v},c))}
function panic(n){P.panic=Math.max(0,Math.min(100,P.panic+n))}
function cause(i){const s=C.suspects[i],seen={};let m=0,bad=0;
  P.clues.filter(c=>c.sure).forEach(c=>{const k=c.trait+c.val;if(seen[k])return;seen[k]=1;
    if(!["height","build","hair","field","district"].includes(c.trait)&&!P.dug[i])return;
    const ok=c.trait==="district"?C.geo.includes(s.district):s[c.trait]===c.val;ok?m++:bad++});
  if(P.talked[i]&&s.talk.slip)m+=2;if(P.sus[i])m+=2;return{m,bad}}
const A={
  tab(t){P.tab=t},
  scene(i){if(spend(cost("scene"))){P.done["s"+i]=1;C.victims[i].scene.forEach(c=>addClue(c,i));P.notice="Scene processed. The physical evidence is in the case file."}},
  autopsy(i){if(spend(cost("autopsy"))){P.done["a"+i]=1;addClue(C.victims[i].autopsy,i);P.notice="Autopsy report added to the case file."}},
  witness(i){if(spend(cost("witness"))){P.done["w"+i]=1;addClue(C.victims[i].witness,i);P.notice="You found a witness. Their statement is in the case file. Witnesses are sometimes wrong."}},
  dig(i){if(spend(cost("dig"))){P.dug[i]=1;P.notice="Background check complete on "+C.suspects[i].name+"."}},
  alibi(i){if(spend(cost("alibi"))){P.alibi[i]=dead();const s=C.suspects[i];P.notice=P.vs.some(v=>s.alibi[v])?s.name+" has a verified alibi.":s.name+" has no alibi anyone can verify."}},
  talk(i){if(spend(cost("talk"))){P.talked[i]=1;P.notice="Interview with "+C.suspects[i].name+" is on their card."}},
  stake(i){if(P.stake===i){P.stake=null;P.hours+=cost("stake");return}if(P.stake!==null){P.notice="You can only watch one suspect a night. Cancel the other stakeout first.";return}if(spend(cost("stake"))){P.stake=i;P.notice="You will sit on "+C.suspects[i].name+" tonight."}},
  patrol(d){if(P.patrol===d){P.patrol=null;P.hours+=cost("patrol");return}if(P.patrol){P.patrol=d;return}if(spend(cost("patrol"))){P.patrol=d;P.notice="Extra patrols will cover "+d+" tonight."}},
  warrant(i){const s=C.suspects[i],c=cause(i),need=rank()>=3?2:3;
    if(c.bad||c.m<need){if(spend(1)){P.searched[i]="denied";P.notice=c.bad?`The judge refused. Evidence you already hold rules ${s.name} out on at least one point.`:`The judge refused. You have ${c.m} point${c.m===1?"":"s"} of probable cause against ${s.name} and need ${need}.`}return}
    if(spend(cost("warrant"))){if(s.killer){P.searched[i]="found";P.notice=`Warrant granted. Behind a false panel in ${s.name}'s home you found keepsakes from every victim and the materials for the mark left at each scene.`}
      else{P.searched[i]="clean";panic(8);P.notice=`Warrant granted. You tore ${s.name}'s home apart and found nothing. The papers have the story.`}}},
  profile(){if(spend(cost("profile"))){P.profile=true;const t=TYPES[C.mo.type];
    addClue({src:"Profile",trait:"district",val:C.geo.join(" or "),sure:true,text:`Mapping the scenes against travel times puts the killer's home in ${C.geo[0]} or ${C.geo[1]}.`},null);
    P.notice="Profile complete. Behavior type: "+t.label+"."}},
  reassure(){if(spend(cost("press"))){P.press=P.day;panic(-12);P.notice="You stood at the podium and told the city you are close. People believed you, for now."}},
  tips(){if(spend(cost("press"))){P.press=P.day;panic(6);const pool=C.victims.filter((v,i)=>!P.done["w"+i]);const w=pool.length?pool[Math.floor(Math.random()*pool.length)].witness:C.victims[0].witness;
    addClue(Object.assign({},w,{src:"Witness",who:"a tip line caller"}),null);P.notice="You asked the public for help. The phones lit up, panic rose, and one call sounded real. It is in the case file."}},
  tag(i){P.tags[i]=({undefined:"sus",sus:"clr",clr:undefined})[P.tags[i]]},
  arrest(i){if(P.confirm!==i){P.confirm=i;return}finish(C.suspects[i].killer?"win":"wrong",i)},
  cancel(){P.confirm=null},
  endDay(){
    P.day++;P.confirm=null;const n=[],st=P.stake,pa=P.patrol;P.stake=P.patrol=null;
    if(P.nxt<C.victims.length&&P.day>=C.strike[P.nxt]){
      const vi=P.nxt++,v=C.victims[vi],k=killer();
      if(st!==null&&C.suspects[st].killer){finish("act",st);return}
      if(pa===v.district){P.saved.push(vi);panic(-15);["height","hair","vehicle"].forEach(t=>addClue({src:"Survivor",trait:t,val:k[t],sure:true,text:clueText("Survivor",t,k[t])},vi));

      else{P.vs.push(vi);panic(18);n.push(`${C.mo.moniker} has killed again. ${v.name} was found ${v.loc} in ${v.district}.`);
        if(pa)n.push(`Your patrols were in ${pa}.`);
        if(st!==null){P.watched[st]=v.name;n.push(`${C.suspects[st].name} was under your eyes all night and did not do this.`)}
        if(dead()>=6){finish("six");return}}
      P.tab="victims";
    }else{
      if(st!==null){const s=C.suspects[st];
        if(s.killer&&Math.random()<.5){P.sus[st]=1;n.push(`${s.name} left home at 1 a.m. and drove slow loops through ${C.victims[P.nxt<9?P.nxt:8].district} before going home. A judge will want to hear that.`)}
        else n.push(`${s.name} did nothing unusual last night.`)}
      if(pa)n.push(`Patrols in ${pa} reported a quiet night.`);
    }
    C.letters.forEach((l,i)=>{if(l.day===P.day){P.letters.unshift(i);panic(4);addClue({src:"Letter",trait:l.trait,val:l.val,sure:false,who:"",text:clueText("Letter",l.trait,l.val)},null);n.push("A letter addressed to you arrived this morning.")}});
    panic(2);if(P.panic>=100){finish("panic");return}
    P.hours=maxHours();if(P.panic>=60)n.push("Press conferences and calls from the mayor are eating into your day.");
    P.notice=n.join(" ");
  },
  copy(){const t=code(C.seed);try{navigator.clipboard.writeText(t)}catch(e){}P.notice="Case code "+t+" copied. Anyone who enters it gets this exact killer."},
  copyResult(){const o=P.over,w=o.how==="win"||o.how==="act";const t=`Murder & Motive, case ${code(C.seed)}: ${w?"caught":"lost to"} ${C.mo.moniker} on day ${P.day} with ${dead()} dead${P.saved.length?" and "+P.saved.length+" saved":""}. Enter the code to try the same killer.`;try{navigator.clipboard.writeText(t)}catch(e){}P.copied=t},
  playCode(){const v=document.getElementById("code").value.trim(),s=parseInt(v,36);
    if(!/^[0-9a-z]{1,7}$/i.test(v)||isNaN(s)||s>4294967295){P.notice="That is not a valid case code.";return}startCase(s);return true},
  newCase(){startCase(newSeed());return true}
};

/* ---------- shared leaderboard + admin (Firebase) ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const F={name:store.get("mm_name",""),email:"",pass:"",wcode:"",wtitle:"",wends:"",banner:"",pcode:""};
const NET={on:!!FIREBASE_CONFIG,ready:false,admin:false,cfg:{},scores:[],board:"",bans:[],msg:"",dirty:false};
const nameKey=n=>String(n).toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,24);
const validCode=v=>/^[0-9a-z]{1,7}$/i.test(v)&&parseInt(v,36)<=4294967295;
function softRender(){const a=document.activeElement;if(a&&a.tagName==="INPUT"){NET.dirty=true;return}render()}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.f;if(k)F[k]=e.target.value});
document.addEventListener("focusout",()=>{if(NET.dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.tagName==="INPUT")){NET.dirty=false;render()}},0)});
async function initNet(){
  if(!NET.on)return;
  try{
    const v="https://www.gstatic.com/firebasejs/10.12.2/";
    const [a,f,au]=await Promise.all([import(v+"firebase-app.js"),import(v+"firebase-firestore.js"),import(v+"firebase-auth.js")]);
    const app=a.initializeApp(FIREBASE_CONFIG);NET.f=f;NET.au=au;NET.db=f.getFirestore(app);NET.auth=au.getAuth(app);NET.ready=true;
    au.onAuthStateChanged(NET.auth,u=>{NET.admin=!!(u&&u.email&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase());
      if(NET.admin){const g=NET.cfg;F.wcode=F.wcode||g.weeklyCode||"";F.wtitle=F.wtitle||g.weeklyTitle||"";F.wends=F.wends||g.weeklyEnds||"";F.banner=F.banner||g.banner||"";loadBans()}softRender()});
    f.onSnapshot(f.doc(NET.db,"config","main"),s=>{NET.cfg=s.exists()?s.data():{};if(!NET.board)loadBoard(NET.cfg.weeklyCode||code(C.seed));else softRender()},()=>{NET.msg="Could not reach the leaderboard.";softRender()});
  }catch(e){NET.msg="Could not reach the leaderboard.";softRender()}
}
async function loadBoard(c){
  NET.board=String(c||"");NET.scores=[];if(!NET.ready||!NET.board){softRender();return}
  try{const f=NET.f,s=await f.getDocs(f.query(f.collection(NET.db,"scores"),f.where("code","==",NET.board)));
    NET.scores=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.won-a.won)||(a.dead-b.dead)||(b.saved-a.saved)||(a.day-b.day)||(a.ts-b.ts));NET.msg=""}
  catch(e){NET.msg="Could not load the standings."}
  softRender()}
async function loadBans(){try{const f=NET.f,s=await f.getDocs(f.collection(NET.db,"bans"));NET.bans=s.docs.map(d=>d.id)}catch(e){}softRender()}
async function submitScore(row){

  <h3>Public panic</h3><div class="bar"><i style="width:${P.panic}%"></i></div>
  <div class="acts" style="margin-top:0"><button class="btn" data-a="reassure" ${pd||P.hours<2?"disabled":""}>Reassure the public <small>2h</small></button><button class="btn" data-a="tips" ${pd||P.hours<2?"disabled":""}>Ask for tips <small>2h</small></button></div>
  <p class="sub" style="margin:6px 0 0">One press briefing a day. Reassuring lowers panic. Asking for tips raises it but brings in a lead.</p></div>
  <div class="panel"><h2>What you know about the killer</h2>
  ${P.profile?`<h3>Behavior</h3><p style="margin:0"><b>${t.label}.</b> ${t.desc}</p>`:""}
  <h3>Established by evidence</h3>${uniq.length?`<ul>${uniq.map(li).join("")}</ul>`:`<p class="empty">Nothing yet.</p>`}
  <h3>Reported by witnesses</h3>${wit.length?`<ul>${wit.map(li).join("")}</ul>`:`<p class="empty">Nothing yet.</p>`}
  ${let_.length?`<h3>From letters, if genuine</h3><ul>${let_.map(li).join("")}</ul>`:""}</div></aside>`;
}
function endScreen(){
  const k=killer(),o=P.over,m=C.mo,win=o.how==="win"||o.how==="act",d=dead();
  const rk=d===2?"Stopped before another death. Nobody does that.":d===3?"One more death than there should have been, but a fast close.":d===4?"A hard case, closed late.":"Closed at the last possible moment.";
  const lead=o.how==="act"?`Your stakeout paid off. On the night before day ${P.day} you followed ${k.name} to their next victim and made the arrest with the weapon in their hand.`
    :o.how==="win"?`You arrested ${k.name} on day ${P.day}. ${rk}`
    :o.how==="wrong"?`You arrested ${C.suspects[o.i].name}. They were innocent, and by the time that was clear, ${k.name} had left ${C.city} for good.`
    :o.how==="panic"?`The city stopped believing you. The mayor handed the case to someone else on day ${P.day}. The killer was ${k.name}.`
    :`${C.victims[P.vs[5]].name} was the sixth to die. The task force was dissolved that afternoon. The killer was ${k.name}.`;
  const fake=C.letters.filter(l=>!l.genuine).length,real=C.letters.length-fake;
  return `<div class="end"><div class="stamp ${win?"win":"lose"}">${win?"Case closed":"Case lost"}</div><h2>${m.moniker}</h2><p>${lead}</p>
  <div class="card"><h3>${k.name}</h3><div class="sub">${k.age}, ${k.occ}, ${k.district}. ${TYPES[m.type].label}.</div>
  <p>${k.name.split(" ")[0]} ${m.motive}. They chose ${m.vtype}, killed by ${m.method}, and left the same mark every time.</p>
  <dl><dt>Height</dt><dd>${k.height}</dd><dt>Build</dt><dd>${k.build}</dd><dt>Hair</dt><dd>${k.hair}</dd><dt>Shoe size</dt><dd>${k.shoe}</dd><dt>Blood type</dt><dd>${k.blood}</dd><dt>Handed</dt><dd>${k.hand}</dd><dt>Habit</dt><dd>${k.habit}</dd><dt>Vehicle</dt><dd>${k.vehicle}</dd></dl>
  <p class="sub" style="margin:0">Letters in this case: ${real} from the killer, ${fake} from cranks.</p></div>
  <p>${d} dead, ${P.saved.length} saved. Reputation earned: ${o.xp}. You are a ${RANKS[rank()][0]} with ${stats.xp}.</p>
  <p>Case code <b>${code(C.seed)}</b>. Share it so someone else can try the same killer.</p>
  <div class="acts">${btn("copyResult","","Copy your result")}<button class="btn dark" data-a="newCase">Open a new case</button></div>
  ${P.copied?`<p class="sub">Copied: ${P.copied}</p>`:""}${o.sub?`<p><b>${o.sub}</b></p>`:""}
  <h3 style="font-size:1.7rem;margin:28px 0 10px">Case archive</h3>${archive()}</div>`;
}
function render(){
  const app=document.getElementById("app");
  if(P.over){app.innerHTML=header()+`<div class="wrap"><img class="banner" src="${LOGO}" alt="Murder &amp; Motive">${endScreen()}</div>`;return}
  const tabs=[["victims",`Victims (${P.vs.length+P.saved.length})`],["suspects","Suspects"],["letters",`Letters (${P.letters.length})`],["log",`Case file (${P.clues.length})`],["board","Leaderboard"],["desk","Desk"]];if(NET.admin)tabs.push(["admin","Admin"]);if(P.tab==="admin"&&!NET.admin)P.tab="desk";
  const body={victims:victimsTab,suspects:suspectsTab,letters:lettersTab,log:logTab,desk:deskTab,board:boardTab,admin:adminTab}[P.tab]();
  app.innerHTML=header()+`<div class="wrap">${NET.cfg.banner?`<div class="notice" style="border-left-color:#c9a227">${esc(NET.cfg.banner)}</div>`:""}${P.tab==="victims"?`<img class="banner" src="${LOGO}" alt="Murder &amp; Motive">`:""}${P.notice?`<div class="notice" role="status">${P.notice}</div>`:""}
  <div class="layout"><main><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${P.tab===t[0]}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join("")}</div>${body}</main>${side()}</div></div>`;
}

/* ---------- boot ---------- */
const saved=store.get("nta2_game",null);
if(saved&&saved.P&&typeof saved.seed==="number"){C=generate(saved.seed);P=saved.P;render()}else startCase(newSeed());
initNet();
</script>
</body>
</html>
